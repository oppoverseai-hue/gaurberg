# Models are named by role. Fill in ids when chosen; do not invent ids.
live_cost_cap_usd: 0
batch_runs: claude_code_subscription   # no per-token fee; cost_usd in agent_runs is the list-price equivalent from the CLI
roles:
  # Candidates for the extractor role, compared on the CRWV gold set (see runs/ and eval_results). Not a decision yet.
  extractor_small:  { model: claude-haiku-5-5,  note: "candidate A for extractor" }
  extractor_main:   { model: claude-sonnet-5-5, note: "candidate B for extractor" }
  extractor:        { model: claude-sonnet-5-5, note: "decided by the admin 2026-10-21 after the CRWV and LYFT comparison (Haiku wrote 2 unsupported quotes)" }
  extractor_second_pass: { model: claude-haiku-5-5, note: "cheap second pass; to be added once the verification step exists" }
  verifier_baseline: { model: claude-haiku-5-5, note: "NOT independent of the extractor (same vendor): a baseline to measure VER-1 and VER-2 until a different-vendor verifier key exists; VER-3 stays unmet" }
  verifier_cheap:   { model: gemini-3.1-flash-lite, note: "different vendor (Google) than the extractor, satisfies VER-3; called via the gemini-proxy edge function; list price $0.25 in / $1.50 out per M tokens" }
  verifier_strong:  { model: TBD, note: "escalation only" }
  live_lookup:      { model: gemini-3.1-flash-lite, note: "decided by the admin 2026-10-21: free-tier Gemini, server-side only (edge function live-lookup reads it from the LIVE_LOOKUP_MODEL secret); if the free allowance is used up, queue to lookup_queue for Claude Code" }
